; ===========================================================================
;  The Setup Wizard's own settings.
; ===========================================================================
; The name below is the ONE place the whole thing is named. A future owner
; renames their drive by editing this line - nothing else needs touching.
;
; The .bat file at the top of the drive is the one thing that cannot follow
; by itself, because a file cannot rename itself while Windows is running it.
; There is a button for that on the wizard's Help tab, "Rename the button at
; the top of the drive", and a Maintenance Steps button that does the same.
;
; NOTE, added 2026-09-06: wizard\wordmark.png is a picture of this name,
; drawn as pixel art, and the Play tab shows it INSTEAD of the name as text.
; wordmark-anim.png is the same picture again, twelve times, which is what
; makes the fire move. Neither can know it has been renamed. So if you change
; the line below, delete BOTH of those files and the plain text name comes
; straight back.
;
; NOTE, added 2026-09-07: the rest of the pictures do NOT say the name, so a
; rename leaves them alone.
;   wizard\tab-*.png    the little picture on each tab. Always still.
;   wizard\page-*.png   the big picture in the corner of each page, with a
;                       page-*-anim.png beside it that makes it move.
;   wizard\lights.png   the four status lights: ok, warn, bad, unknown.
; Delete any of them and that picture simply disappears: the tab keeps its
; word, the corner goes empty, or the lights go back to plain coloured dots.
; They are redrawn by docs\art\build.py, which nothing on the drive runs.

name    = RetroBat Wizard
; The version moved to _Wizard\version.txt on 2026-10-10. Updates
; replace that file and never touch this one, which is the owner's.
