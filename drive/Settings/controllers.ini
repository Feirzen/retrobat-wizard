; ===========================================================================
;  CONTROLLERS - which controller each Wii and Wii U game wants
; ===========================================================================
;  Every Wii and Wii U game gets one line here. Pressing PLAY then does two
;  things with it, before RetroBat opens:
;
;    1. The game's description in the menu starts with a line saying which
;       controller to pick up, so anybody browsing can see it. A re-scrape
;       can wipe it; the next PLAY puts it back.
;    2. Wii U only: the settings in that kind's section below are written
;       for that game (through profiles\game-settings.ini, which PLAY keeps
;       in step with this file). This is what actually switches a game
;       between Wii Remotes and controllers.
;
;  HOW A GAME LINE READS
;     kind | file name | game name | extra note (optional)
;  The kind is one of the [kind ...] sections below. The file name has to
;  match the game's file exactly. The game name is only for people. An
;  extra note is added to the end of that game's controller line.
;
;  THE WII U RULE (decided by Steven, 2026-09-25)
;  Controllers for solo and two-player games. Wii Remotes only for the big
;  3-4 player party games - as a rule of thumb, not a law: a game that
;  plays best on Wii Remotes can be put on them whatever its player count.
;  A Wii U game is one or the other, never both: once a game is set to real
;  Wii Remotes, controllers stop working in it, AND there is no Wii U
;  GamePad either (RetroBat sets up real Wii Remotes only). So a game that
;  needs the GamePad for player 1 cannot go on real Wii Remotes.
;
;  NEW GAMES that are not in here yet are left alone and listed in
;  new-games-to-check.txt next to this file.
;
;  TO MOVE A GAME: change its kind, save, press PLAY. Nothing else. Or use
;  the Setup Wizard: Profiles tab, Advanced, One game at a time, pick the
;  game, and choose from the Controllers dropdown.
; ===========================================================================


; ---------------------------------------------------------------------------
;  THE KINDS
;  console = which console the kind is for (the wizard only offers a
;          Wii kind for a Wii game, and so on).
;  menu  = the short name the Setup Wizard shows in its dropdown.
;  label = the words shown at the top of the description, after
;          "Controllers: ".
;  set.<setting> = <value>  (Wii U only) a RetroBat setting written for
;          every game of this kind. The names are the ones RetroBat itself
;          uses in its GAME OPTIONS menu.
; ---------------------------------------------------------------------------

; --- Wii U -----------------------------------------------------------------

[kind party-wiimotes]
console = wiiu
menu = Wii Remotes (real ones, held sideways)
label = Wii Remotes, held sideways. Other controllers do not work in this game.
set.use_wiimotes = 4

[kind pro]
console = wiiu
menu = Controllers
label = Pro Controllers (Xbox, PlayStation, Switch Pro, etc.).

; These games insist player 1 is holding the Wii U GamePad. The controller
; in your hands simply acts as one; nobody has to do anything different.
[kind pro-p1gamepad]
console = wiiu
menu = Controllers (player 1 acts as the Wii U GamePad)
label = Pro Controllers (Xbox, PlayStation, Switch Pro, etc.).
set.cemu_controllerp0 = gamepad

; Same again, and the game NEEDS the Wii U GamePad's screen. It opens in a
; second window and the mouse is your finger.
[kind pro-touch]
console = wiiu
menu = Controllers + the Wii U GamePad screen in its own window
label = Needs the Wii U GamePad screen, which opens in another window: click it with the mouse. Otherwise Pro Controllers (Xbox, PlayStation, Switch Pro, etc.).
set.cemu_controllerp0 = gamepad
set.cemu_open_pad = 1

; An experiment, for Scribblenauts (2026-09-25): player 1 is the GamePad as
; above, and players 2-4 are EMULATED sideways Wii Remotes made from ordinary
; controllers. Real Wii Remotes cannot be mixed with the GamePad here -
; RetroBat's own code sets up either all real Wii Remotes or none. If the
; extra players cannot do anything, move the game to pro-touch.
[kind touch-extras-wiimote]
console = wiiu
menu = Controllers + GamePad screen, extra players as sideways Wii Remotes (test)
label = Needs the Wii U GamePad screen, which opens in another window: click it with the mouse. Otherwise Pro Controllers (Xbox, PlayStation, Switch Pro, etc.); for players 2 to 4 they act as sideways Wii Remotes.
set.cemu_controllerp0 = gamepad
set.cemu_open_pad = 1
set.cemu_controllerp1 = wiimote_horizontal
set.cemu_controllerp2 = wiimote_horizontal
set.cemu_controllerp3 = wiimote_horizontal

; --- Wii (labels only - nothing about how Wii games run is changed) -------

[kind remote]
console = wii
menu = Wii Remote
label = Wii Remote.

[kind sideways]
console = wii
menu = Wii Remote, held sideways
label = Wii Remote, held sideways.

[kind nunchuk]
console = wii
menu = Wii Remote + Nunchuk
label = Wii Remote + Nunchuk.

[kind motionplus]
console = wii
menu = Wii Remote Plus (MotionPlus)
label = Wii Remote Plus (a Wii Remote with MotionPlus).

[kind motionplus-nunchuk]
console = wii
menu = Wii Remote Plus + Nunchuk
label = Wii Remote Plus (with MotionPlus) + Nunchuk.

[kind remote-or-pad]
console = wii
menu = Wii Remote, or a controller (as a GameCube controller)
label = Wii Remote, or a controller (Xbox, PlayStation, Switch Pro, etc.) which acts as a GameCube controller.

[kind dance]
console = wii
menu = Wii Remote, held in your right hand (dance games)
label = Wii Remote, held in your right hand.

[kind instruments]
console = wii
menu = Rock Band guitar and drum controllers
label = Wii Remote for the menus. Made for Rock Band guitar and drum controllers.


