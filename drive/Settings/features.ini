; ===========================================================================
;  WHAT THIS DRIVE DOES FOR YOU - the on/off switches
; ===========================================================================
;  Every line below is one thing this drive does that plain RetroBat does
;  not. Write on or off after the = sign, save the file, then run
;  RUN THIS AFTER AN UPDATE.bat to make the change real - or use the
;  Features tab in the Setup Wizard, which does both for you.
;
;  Anything this file cannot make sense of counts as ON, which is how the
;  drive behaved before these switches existed. So a typo here can never
;  quietly turn something off.
;
;  Keep the comments. They are what makes this readable to whoever ends up
;  owning the drive.
; ---------------------------------------------------------------------------

[features]

; Wii boots through the Wii Menu
;   on   Wii discs start at the real Wii System Menu, then the game.
;   off  Off boots straight into the game, the way RetroBat does.
wiisystemmenu     = on

; Ask Wii Remotes or Pro Controller (added 2026-10-13)
;   on   Wii U party games ask before launching: Wii Remotes or a Pro
;        Controller. Games that need the Wii U GamePad never ask.
;   off  Off launches every Wii U game the way controllers.ini sets it.
wiiuchooser       = on

; How to play, before keyboard games (added 2026-10-17)
;   on   Flash, point-and-click and browser games first show how the
;        controller works in them, with PLAY or Back.
;   off  Off starts them straight away.
howtoplay         = on

; Wii: Wii Remotes or a controller? (added 2026-10-17)
;   on   Wii games that also play with a controller ask first; a
;        controller skips the Wii Menu.
;   off  Off: they always start the usual way.
wiichooser        = on

; Family-friendly (added 2026-10-25)
;   on   Hides M-rated games from RetroBat's menus (from the next PLAY), the
;        online library and Jump in. Your own additions: family-hide.txt.
;   off  Off: every game shows.
familyfilter      = off


; Ask before a slow launch
;   on   A confirmation menu on 3DS, Wii U, DS and the ports.
;   off  Off removes it. Those games launch the moment you press A.
launchmenu        = on

; Reworded menus
;   on   LAUNCH GAME instead of START NEW GAME, and three backup lines.
;   off  Off puts RetroBat's own wording back.
rewordedmenus     = on

; Fixed 3DS idle frame
;   on   The idle screen shows the real 3DS, re-cut on 2026-09-06 so a preview
;        video fills its top screen and only a sliver of the bottom screen
;        shows. This is the good setting, and it is why the 3DS idle screen
;        looks the way it does.
;   off  Off uses the plain curved-TV frame instead, and the 3DS frame is
;        moved into archive\decorations-hidden.
;
;   Renamed 2026-09-18. This used to be 'hidedecorations', called "Plain frame
;   for 3DS", and it was the same switch upside down: its good setting was
;   'off', which reads as though something is disabled. An old features.ini
;   saying hidedecorations is still understood - see Get-Features.
fixed3dsframe     = on

; Collection artwork
;   on   Keeps the Zelda and Pokemon artwork, video and colour in the theme.
;   off  Off stops maintaining it. What is already there stays.
themecollections  = on

; Automatic save backup
;   on   Copies changed game saves into SaveBackups after every game.
;   off  Off stops backing up. What is already kept stays.
savebackup        = on
autosavetimer     = on

; Even out video volume
;   on   Re-records game, menu and intro videos so none of them shout.
;   off  Off leaves new videos alone. Levelled ones stay levelled.
videovolume       = on

; One scroll sound
;   on   Every game list scrolls with the same soft Wii U sound (changed from
;        the Game Boy Color sound on 2026-09-25).
;   off  Off puts the theme's own per-system sounds back. Some of those
;        (GameCube, 3DS) are unpleasant, which is why this exists.
;        The main menu sound is not affected either way.
scrollsound       = on

; Unpack new 3DS roms
;   on   Extracts any new .7z in roms\3ds so the game appears in the menu.
;   off  Off leaves archives packed. Unpacked games are unaffected.
unpack3ds         = on
