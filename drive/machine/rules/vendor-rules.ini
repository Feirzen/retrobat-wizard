; ===========================================================================
;  VENDOR RULES - graphics backend per GPU brand (Layer 2)
; ===========================================================================
;  Which drawing method each emulator uses depends on the BRAND of graphics
;  card, not on how strong it is. A brand-new AMD card and an ageing Nvidia
;  one need different answers at the same tier - that is why this file exists
;  separately from the tier files.
;
;  Whichever section matches the detected GPU brand is applied on top of the
;  tier. A machine's own overrides (profiles\machines\) still win over both.
;
;  Keys here use the full "console.setting" form.
; ===========================================================================

[nvidia]
; HARD RULE, do not change: Azahar's Vulkan backend is badly broken on Nvidia
; cards - a modern RTX card was reported at 30-40% speed on Vulkan and full
; speed on OpenGL, closed with no fix planned:
;   https://github.com/azahar-emu/azahar/issues/1179
; 1 = OpenGL.
3ds.graphics_api            = 1
; DirectX 11 for Dolphin - the value that has been running well on the ZTower
; (Quadro P2200) since this drive was set up.
gamecube.dolphin_gfxbackend = D3D
wii.dolphin_gfxbackend      = D3D
; 1 = Vulkan for Cemu. Needed for Cemu's async shader compile (the
; anti-stutter feature the tiers switch on).
wiiu.video_renderer         = 1

[amd]
; AMD's OpenGL driver on Windows is historically poor - Vulkan is the strong
; backend on AMD for all three of these emulators.
3ds.graphics_api            = 2
gamecube.dolphin_gfxbackend = Vulkan
wii.dolphin_gfxbackend      = Vulkan
wiiu.video_renderer         = 1

[intel]
; Intel's OpenGL driver on Windows is also weak; Vulkan for Azahar, and
; DirectX 11 for Dolphin, are the safe picks on Intel graphics.
3ds.graphics_api            = 2
gamecube.dolphin_gfxbackend = D3D
wii.dolphin_gfxbackend      = D3D
wiiu.video_renderer         = 1

[unknown]
; Brand could not be identified. Only set what has a safe answer everywhere:
; OpenGL for Azahar runs on everything. Dolphin and Cemu are left on their
; own defaults.
3ds.graphics_api            = 1
