; ===========================================================================
;  SETTINGS FOR ONE GAME, ON EVERY COMPUTER
; ===========================================================================
;  RetroBat can hold a setting for a single game as well as for a whole
;  console. There are two places to put one, and which you pick is a real
;  question with a real answer:
;
;    HERE, if the setting is about the ROOM rather than the computer.
;    Which controller a game expects is about what is plugged in and who is
;    sitting on the sofa, and it is the same answer at home and at a
;    friend's house. So it belongs to the drive, not to a machine profile.
;
;    In a profile's [game-settings] section, if the setting is about how
;    HARD the computer has to work. "Breath of the Wild at 720p" is true of
;    a laptop and wrong for the tower, so it belongs to whichever profile
;    it is true for, and stops applying when another profile takes over.
;
;  A profile's own line WINS over one here, so a machine can disagree with
;  this file about one game without editing it.
;
;  HOW A LINE IS SHAPED
;
;      console[the game's file name].setting = value
;
;  The file name is the rom exactly as it sits in roms\<console>\, with its
;  extension, and with NO quotes around it - Apply-Settings adds the quotes
;  EmulationStation wants. The Setup Wizard's Profiles tab writes these for
;  you, under Advanced.
;
;  The easiest way to find a setting's name is to set it once in RetroBat
;  itself (highlight the game, press Select for GAME OPTIONS, then ADVANCED
;  GAME OPTIONS) and look at what appears in es_settings.cfg.
;
;  Keep the comments. They are what makes this readable to whoever ends up
;  owning the drive.
; ---------------------------------------------------------------------------

[game-settings]

