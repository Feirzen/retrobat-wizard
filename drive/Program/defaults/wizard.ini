; ===========================================================================
;  The wizard's own name. (This is the copy a new setup starts with; the
;  setup's own copy is _Wizard\Settings\wizard.ini.)
; ===========================================================================
; The name below is the ONE place the whole thing is named. A future owner
; renames their setup by editing this line in Settings\wizard.ini - nothing
; else needs touching.
;
; The .bat file at the top of the RetroBat folder is the one thing that
; cannot follow by itself, because a file cannot rename itself while Windows
; is running it. There is a button for that on the wizard's Help tab, "Rename
; the button", and a Buttons\Rename The Wizard Button.bat that does the same.
;
; Program\wizard\wordmark.png is a picture of the words "THE RETROBAT
; WIZARD", not of this name, so a rename leaves every picture alone.

name    = RetroBat Wizard
; The version lives in _Wizard\version.txt. Updates replace that file and
; never touch Settings\wizard.ini, which is the owner's.
