; ===========================================================================
;  THE RETROBAT SETTINGS A NEW SETUP STARTS WITH              (2026-10-17)
; ===========================================================================
;  Written ONCE, by the wizard's first-run setup (scripts\FirstRunDefaults.ps1),
;  never again: anything changed afterwards inside RetroBat stays changed.
;  Taken from Steven's own RetroBat. One line each:
;      kind   name   = value          (kind is bool, int or string)
; ---------------------------------------------------------------------------

; --- the front end ----------------------------------------------------------
; No background music in the menus.
bool   audio.bgmusic              = false
int    MusicVolume                = 65
bool   EnableSounds               = true
bool   ClockMode12                = true
bool   IgnoreLeadingArticles      = true
string StartupSystem              = all

; --- the collections: only All games, 2 players and 4 players ---------------
; (Arcade, light gun, favourites and the rest start switched off. Ports and
; every console with games in it show as normal.)
string CollectionSystemsAuto      = 2players,4players,all
string all.defaultView            = grid
string 2players.defaultView       = Grid + Details
string 4players.defaultView       = Grid + Details

; --- the screensaver ---------------------------------------------------------
string ScreenSaverBehavior        = random video
string ScreenSaverGameInfo        = start & end
bool   ScreenSaverDateTime        = true
string ScreenSaverDateFormat      = %b %d, %Y
string ScreenSaverTimeFormat      = %I:%M %p

; --- game lists ---------------------------------------------------------------
bool   ShowSaveStates             = true
bool   ShowManualIcon             = true
string ShowFlags                  = auto
string ShowTags                   = auto

; --- scraping (finding box art, videos and descriptions) -----------------------
bool   LocalArt                   = true
bool   ScrapeVideos               = true
bool   ScrapeManual               = true
string ScraperRegion              = us
string ScrapperImageSrc           = sstitle

; --- in games -------------------------------------------------------------------
string global.bezel               = default_curve_night
string global.tattoo              = 1
string global.savestates          = 1
string global.retroachievements.sound = none
bool   global.netplay             = true

; --- added 2026-10-25 from Steven's RetroBat (Steven: "all sorts of funky
; things ... I want those settings to apply on wizard install"). Left out on
; purpose: his ScreenScraper login (that is scraper.txt), his netplay name,
; paths on his computer, settings for single games, his own collections,
; the theme (the wizard switches to ckau-book once it is there) and the
; graphics quality ones (resolution, anti-aliasing and so on: the machine
; tiers pick those for each computer's power).

; --- language: English (UK/EU) ----------------------------------------------
string Language                       = en_GB
; RetroBat must stop picking the language from Windows, or it would undo it.
ini    RetroBat.LanguageDetection     = 0

