; ===========================================================================
;  LOW tier - weak graphics: laptop chips without their own card, old GPUs
; ===========================================================================
;  One of the three base tiers of the machine profile system. Every setting
;  here is written into es_settings.cfg by Apply My Settings, prefixed with
;  its console name ("internal_resolution" under [wii] becomes
;  "wii.internal_resolution").
;
;  Low means: run the game at native resolution and accept small glitches in
;  exchange for full speed. Everything older than GameCube runs at full speed
;  on any machine, which is why only these six consoles have profiles at all.
;
;  Editing this file changes EVERY machine that uses the Low tier, except
;  settings a machine has pinned in its own file under profiles\machines\.
;  Graphics backends (OpenGL vs Vulkan vs DirectX) are NOT here - they depend
;  on the GPU brand, not its strength, and live in rules\vendor-rules.ini.
; ===========================================================================

[gamecube]
internal_resolution           = 1      ; 1 = native. The biggest performance dial
ShaderCompilationMode         = 3      ; 3 = skip drawing: never stutters, brief
                                       ; missing effects while shaders build
WaitForShadersBeforeStarting  = 0      ; start fast
EnableGPUTextureDecoding      = 0      ; weak GPUs should not take extra work
SafeTextureCacheColorSamples  = 128    ; 128 = rapid: speed over texture accuracy
anisotropic_filtering         = 0      ; off
antialiasing                  = 0x00000001  ; 0x00000001 = off
ssaa                          = 0      ; 0 = MSAA mode (only matters if AA on)
dolphin_cputhread             = 1      ; dual core, on for every tier
perf_hacks                    = 1      ; Dolphin's "run it, accept glitches" switch

[wii]
internal_resolution           = 1
ShaderCompilationMode         = 3
WaitForShadersBeforeStarting  = 0
EnableGPUTextureDecoding      = 0
SafeTextureCacheColorSamples  = 128
anisotropic_filtering         = 0
antialiasing                  = 0x00000001
ssaa                          = 0
dolphin_cputhread             = 1
perf_hacks                    = 1

[wiiu]
async_texture                 = 1      ; Cemu's anti-stutter feature, on everywhere
accurate_sync                 = 0      ; speed over correctness
upscaleFilter                 = 0      ; 0 = bilinear, the cheap one
downscaleFilter               = 0
cemu_vsync                    = 0      ; off - never hold a weak GPU back
; note: Cemu's internal resolution is not a RetroBat setting (graphic packs
; only), so every tier runs Wii U at native.

[3ds]
azahar_resolution_factor      = 1      ; native (400x240). The biggest 3DS dial
azahar_texture_filter         = 0      ; 0 = none
azahar_audio_emulation        = 0      ; 0 = HLE fast. LLE is never worth it

[nds]
melonds_internal_resolution   = 1      ; native. 2D is a hardware limit anyway
melonds_renderer              = 0      ; 0 = software: safest on weak graphics
melonds_polygon               = 0
melonds_vsync                 = 0

[n64]
43screensize                  = 640x480     ; near native, 4:3 games
169screensize                 = 960x540     ; near native, widescreen
MultiSampling                 = 0      ; anti-aliasing off
Texture_Enhancement           = None
Texture_filter                = None
mupen64plus-cpucore           = dynamic_recompiler   ; fastest, every tier
