; ===========================================================================
;  HIGH tier - strong graphics cards (GTX 1070 and up, any RTX, modern AMD)
; ===========================================================================
;  One of the three base tiers of the machine profile system. Every setting
;  here is written into es_settings.cfg by Apply My Settings, prefixed with
;  its console name ("internal_resolution" under [wii] becomes
;  "wii.internal_resolution").
;
;  High means: full 1080p-quality picture with the trimmings, because the
;  card will not notice.
;
;  Editing this file changes EVERY machine that uses the High tier, except
;  settings a machine has pinned in its own file under profiles\machines\.
;  Graphics backends (OpenGL vs Vulkan vs DirectX) are NOT here - they depend
;  on the GPU brand, not its strength, and live in rules\vendor-rules.ini.
; ===========================================================================

[gamecube]
internal_resolution           = 3      ; 3 = 1080p. The biggest performance dial
ShaderCompilationMode         = 1      ; 1 = exclusive: no mid-game hitching
WaitForShadersBeforeStarting  = 1      ; longer first load, then no stutter
EnableGPUTextureDecoding      = 1      ; moves work from CPU to GPU
SafeTextureCacheColorSamples  = 512    ; 512 = intermediate accuracy
anisotropic_filtering         = 4      ; 4 = 16x. Nearly free on a strong card
antialiasing                  = 0x00000004  ; 0x00000004 = 4x anti-aliasing
ssaa                          = 0      ; 0 = MSAA (SSAA would be far heavier)
dolphin_cputhread             = 1      ; dual core, on for every tier
perf_hacks                    = 0      ; accuracy over speed hacks

[wii]
internal_resolution           = 3
ShaderCompilationMode         = 1
WaitForShadersBeforeStarting  = 1
EnableGPUTextureDecoding      = 1
SafeTextureCacheColorSamples  = 512
anisotropic_filtering         = 4
antialiasing                  = 0x00000004
ssaa                          = 0
dolphin_cputhread             = 1
perf_hacks                    = 0

[wiiu]
async_texture                 = 1      ; Cemu's anti-stutter feature, on everywhere
accurate_sync                 = 1      ; correctness over speed
upscaleFilter                 = 1      ; 1 = bicubic scaling
downscaleFilter               = 1
cemu_vsync                    = 1      ; 1 = double-buffer vsync
; note: Cemu's internal resolution is not a RetroBat setting (graphic packs
; only), so every tier runs Wii U at native.

[3ds]
azahar_resolution_factor      = 3      ; 3x native, sharp on a 1080p TV
azahar_texture_filter         = 3      ; 3 = scaleforce, costs frames but a
                                       ; High card has them to spare
azahar_audio_emulation        = 0      ; 0 = HLE fast. LLE is never worth it

[nds]
melonds_internal_resolution   = 8      ; 8x for 3D games. 2D is a hardware limit
melonds_renderer              = 2      ; 2 = OpenGL compute shaders, the good one
melonds_polygon               = 1      ; better polygon rendering
melonds_vsync                 = 1

[n64]
43screensize                  = 1920x1440   ; internal resolution, 4:3 games
169screensize                 = 2560x1440   ; internal resolution, widescreen
MultiSampling                 = 4      ; anti-aliasing. 8x costs a lot for little
Texture_Enhancement           = None   ; texture upscalers break some games -
                                       ; turn on per machine if wanted
Texture_filter                = None
mupen64plus-cpucore           = dynamic_recompiler   ; fastest, every tier
